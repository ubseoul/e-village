<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>E Village</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Instrument+Serif&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">

<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
:root {
  --bg:#000;--surface:#0a0a0a;--elevated:#141414;
  --border:#1a1a1a;--border-l:#2a2a2a;
  --t1:#fff;--t2:#888;--t3:#555;--t4:#333;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:'DM Sans',sans-serif;background:var(--bg);
  color:var(--t1);-webkit-font-smoothing:antialiased;
}

/* ═══ LOGIN ═══ */
.login{
  position:fixed;inset:0;z-index:100;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .5s,transform .5s;
}
.login.gone{opacity:0;pointer-events:none;transform:scale(1.03)}
.login-inner{width:100%;max-width:340px;padding:0 24px}
.login-brand{text-align:center;margin-bottom:40px}
.login-brand h1{font-family:'Instrument Serif',serif;font-size:2.2rem;font-weight:400;letter-spacing:-.02em;margin-bottom:6px}
.login-brand p{font-size:.75rem;color:var(--t3);letter-spacing:.2em;text-transform:uppercase}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:.7rem;color:var(--t3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;font-weight:500}
.login-field input{
  width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:6px;padding:11px 14px;color:var(--t1);
  font-family:inherit;font-size:.85rem;outline:none;transition:border-color .2s;
}
.login-field input:focus{border-color:var(--t3)}
.login-field input::placeholder{color:var(--t4)}
.l-btn{
  width:100%;padding:12px;margin-top:6px;background:var(--t1);color:var(--bg);
  border:none;border-radius:6px;font-family:inherit;font-size:.85rem;font-weight:600;
  cursor:pointer;transition:opacity .15s;
}
.l-btn:hover{opacity:.85}
.l-btn:disabled{opacity:.4;cursor:wait}
.l-div{
  display:flex;align-items:center;gap:14px;margin:20px 0;
  color:var(--t4);font-size:.65rem;text-transform:uppercase;letter-spacing:.15em;
}
.l-div::before,.l-div::after{content:'';flex:1;height:1px;background:var(--border)}
.l-toggle{
  background:none;border:none;color:var(--t2);
  font-family:inherit;font-size:.8rem;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;
}
.l-toggle:hover{color:var(--t1)}
.l-error{
  color:#e55;font-size:.75rem;text-align:center;
  margin-top:12px;min-height:20px;
}

/* ═══ APP SHELL ═══ */
.shell{
  height:100vh;height:100dvh;display:flex;flex-direction:column;
  opacity:0;transition:opacity .4s .2s;
}
.shell.on{opacity:1}

.topbar{
  height:42px;min-height:42px;background:var(--surface);
  border-bottom:1px solid var(--border);display:flex;
  align-items:center;justify-content:space-between;
  padding:0 16px;z-index:10;flex-shrink:0;
}
.tb-brand{font-family:'Instrument Serif',serif;font-size:1.05rem;font-weight:400}
.tb-right{display:flex;align-items:center;gap:10px}
.tb-user{font-size:.75rem;color:var(--t2);display:flex;align-items:center;gap:6px}
.tb-stat{
  font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--t3);
  background:var(--elevated);padding:3px 8px;border-radius:10px;
}
.tb-logout{
  background:none;border:1px solid var(--border);border-radius:4px;
  color:var(--t3);font-family:inherit;font-size:.65rem;
  padding:3px 8px;cursor:pointer;transition:all .15s;
}
.tb-logout:hover{border-color:var(--t3);color:var(--t2)}

.content{flex:1;display:flex;overflow:hidden;min-height:0}

/* ═══ VIDEO ═══ */
.video-area{flex:1;display:flex;flex-direction:column;min-width:0}
.video-embed{flex:1;background:#000;position:relative;min-height:0}
.video-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.video-placeholder{
  position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:12px;
  background:var(--bg);cursor:pointer;transition:background .2s;
}
.video-placeholder:hover{background:#080808}
.vp-play{
  width:56px;height:56px;border-radius:50%;border:2px solid var(--t4);
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;color:var(--t3);transition:all .2s;
}
.video-placeholder:hover .vp-play{border-color:var(--t2);color:var(--t1)}
.vp-text{font-size:.75rem;color:var(--t4);letter-spacing:.1em;text-transform:uppercase}
.video-embed.loaded .video-placeholder{display:none}

.player-strip{
  height:48px;min-height:48px;background:var(--surface);
  border-top:1px solid var(--border);display:flex;
  align-items:center;padding:0 14px;gap:12px;flex-shrink:0;
}
.ps-btn{background:none;border:none;color:var(--t2);cursor:pointer;font-size:.9rem;padding:4px;transition:color .15s}
.ps-btn:hover{color:var(--t1)}
.ps-play{
  width:30px;height:30px;background:var(--t1);color:var(--bg);
  border:none;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:.7rem;cursor:pointer;transition:opacity .15s;
}
.ps-play:hover{opacity:.8}
.ps-info{flex:1;min-width:0}
.ps-title{font-size:.8rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-sub{font-size:.65rem;color:var(--t3)}
.ps-pills{display:flex;gap:4px}
.ps-pill{
  padding:4px 10px;border-radius:14px;border:1px solid var(--border);
  background:transparent;color:var(--t3);font-family:inherit;font-size:.7rem;
  cursor:pointer;transition:all .15s;
}
.ps-pill:hover{border-color:var(--t3);color:var(--t2)}
.ps-pill.on{border-color:var(--t2);color:var(--t1);background:rgba(255,255,255,.05)}

/* ═══ FEED PANEL ═══ */
.feed-panel{
  width:300px;min-width:300px;background:var(--surface);
  border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;
}
.feed-head{
  height:42px;min-height:42px;display:flex;align-items:center;
  justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--border);
}
.feed-head-label{font-size:.7rem;color:var(--t3);text-transform:uppercase;letter-spacing:.1em;font-weight:500}
.feed-head-count{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--t4)}

/* Egg + Materials mini bar */
.status-bar{
  padding:10px 14px;border-bottom:1px solid var(--border);
  display:flex;flex-direction:column;gap:8px;
}
.egg-row{display:flex;justify-content:space-between;align-items:center}
.egg-row-label{font-size:.7rem;color:var(--t3)}
.egg-row-timer{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--t4)}
.egg-track{height:2px;background:var(--border);border-radius:2px;overflow:hidden}
.egg-track-fill{height:100%;background:var(--t1);border-radius:2px;transition:width .5s linear;width:0%}
.mats-row{display:flex;gap:8px}
.mat-chip{
  flex:1;display:flex;align-items:center;gap:4px;
  font-size:.7rem;color:var(--t3);
}
.mat-chip .n{font-family:'JetBrains Mono',monospace;color:var(--t2)}

/* Spirits mini strip */
.spirits-strip{
  padding:10px 14px;border-bottom:1px solid var(--border);
  display:flex;gap:8px;
}
.spirit-mini{
  flex:1;background:var(--elevated);border:1px solid var(--border);
  border-radius:8px;padding:8px;text-align:center;
  cursor:pointer;transition:border-color .15s;
}
.spirit-mini:hover{border-color:var(--border-l)}
.spirit-mini-name{font-size:.7rem;font-weight:500;margin-bottom:2px}
.spirit-mini-stage{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--t4)}
.spirit-mini-icon{font-size:1.2rem;margin-bottom:4px}
.evo-pips{display:flex;gap:3px;justify-content:center;margin-top:4px}
.evo-pip{width:14px;height:2px;border-radius:2px;background:var(--border)}
.evo-pip.on{background:var(--t1)}

.feed-scroll{flex:1;overflow-y:auto;padding:6px}
.feed-scroll::-webkit-scrollbar{width:3px}
.feed-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.fi{display:flex;gap:8px;padding:8px;border-radius:6px;animation:fiIn .3s ease-out}
.fi:hover{background:rgba(255,255,255,.02)}
@keyframes fiIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.fi-icon{
  width:26px;height:26px;border-radius:6px;background:var(--elevated);
  display:flex;align-items:center;justify-content:center;font-size:.75rem;flex-shrink:0;
}
.fi-body{flex:1;min-width:0}
.fi-text{font-size:.75rem;color:var(--t2);line-height:1.3}
.fi-text b{color:var(--t1);font-weight:600}
.fi-time{font-family:'JetBrains Mono',monospace;font-size:.55rem;color:var(--t4);margin-top:2px}

/* ═══ EVOLVE MODAL ═══ */
.modal-bg{
  position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);
  backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-bg.open{opacity:1;pointer-events:all}
.modal-box{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;width:90%;max-width:340px;padding:24px;
  text-align:center;transform:scale(.95);transition:transform .2s;
}
.modal-bg.open .modal-box{transform:scale(1)}
.modal-icon{font-size:2rem;margin-bottom:8px}
.modal-title{font-family:'Instrument Serif',serif;font-size:1.3rem;margin-bottom:4px}
.modal-stage{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--t3);margin-bottom:16px}
.modal-cost{font-size:.75rem;color:var(--t3);margin-bottom:16px;line-height:1.6}
.modal-cost b{color:var(--t2)}
.modal-btn{
  padding:10px 24px;border-radius:6px;border:none;
  background:var(--t1);color:var(--bg);font-family:inherit;
  font-size:.85rem;font-weight:600;cursor:pointer;
  transition:opacity .15s;margin-right:8px;
}
.modal-btn:hover{opacity:.85}
.modal-btn:disabled{opacity:.3;cursor:not-allowed}
.modal-btn.secondary{
  background:transparent;border:1px solid var(--border);
  color:var(--t2);
}
.modal-btn.secondary:hover{border-color:var(--t3)}

/* Toast */
.toast{
  position:fixed;top:52px;left:12px;z-index:50;
  background:var(--elevated);border:1px solid var(--border);
  border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.6);opacity:0;transform:translateX(-16px);
  transition:all .35s cubic-bezier(.34,1.56,.64,1);pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(0)}
.toast-icon{font-size:1.1rem}
.toast-text{font-size:.75rem;font-weight:500}
.toast-sub{font-size:.6rem;color:var(--t3)}

/* ═══ MOBILE ═══ */
@media(max-width:768px){
  .content{flex-direction:column}
  .video-area{flex:none;height:56vw;min-height:200px}
  .feed-panel{width:100%;min-width:100%;flex:1;border-left:none;border-top:1px solid var(--border)}
  .player-strip{height:44px;min-height:44px;padding:0 10px;gap:8px}
  .ps-pills{display:none}
  .topbar{height:38px;min-height:38px;padding:0 12px}
  .tb-brand{font-size:.95rem}
  .toast{top:44px;left:8px}
  .spirits-strip{gap:6px;padding:8px 10px}
}
@media(max-width:420px){
  .video-area{height:52vw;min-height:180px}
}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div class="login" id="login">
  <div class="login-inner">
    <div class="login-brand">
      <h1>E Village</h1>
      <p>lo-fi &middot; spirits &middot; collect</p>
    </div>
    <div class="login-field">
      <label id="fieldUsername" style="display:none">Username</label>
      <input type="text" id="inUser" placeholder="pick a username" style="display:none">
    </div>
    <div class="login-field">
      <label>Email</label>
      <input type="email" id="inEmail" placeholder="you@email.com">
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="inPass" placeholder="&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;">
    </div>
    <button class="l-btn" id="authBtn" onclick="doAuth()">Sign In</button>
    <div class="l-error" id="authError"></div>
    <div class="l-div">or</div>
    <button class="l-toggle" id="authToggle" onclick="toggleAuthMode()">Need an account? Sign up</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <div class="toast-icon" id="toastI">🥚</div>
  <div>
    <div class="toast-text" id="toastT"></div>
    <div class="toast-sub" id="toastS"></div>
  </div>
</div>

<!-- EVOLVE MODAL -->
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modalBox"></div>
</div>

<!-- ═══ APP ═══ -->
<div class="shell" id="shell">
  <div class="topbar">
    <div class="tb-brand">E Village</div>
    <div class="tb-right">
      <div class="tb-stat" id="eggCount">🥚 0</div>
      <div class="tb-stat" id="listenTime">🎧 0m</div>
      <div class="tb-user"><span id="userName">—</span></div>
      <button class="tb-logout" onclick="doLogout()">logout</button>
    </div>
  </div>
  <div class="content">
    <div class="video-area">
      <div class="video-embed" id="videoEmbed">
        <div class="video-placeholder" id="videoPlaceholder" onclick="startStream()">
          <div class="vp-play">▶</div>
          <div class="vp-text">Start Lo-Fi Stream</div>
        </div>
      </div>
      <div class="player-strip">
        <button class="ps-play" id="psPlay" onclick="startStream()">▶</button>
        <div class="ps-info">
          <div class="ps-title" id="psTitle">lo-fi hip hop radio</div>
          <div class="ps-sub" id="psSub">Café vibes</div>
        </div>
        <div class="ps-pills">
          <button class="ps-pill on" data-pl="cafe" onclick="setPl(this)">Café</button>
          <button class="ps-pill" data-pl="outdoors" onclick="setPl(this)">Outdoors</button>
          <button class="ps-pill" data-pl="focus" onclick="setPl(this)">Focus</button>
        </div>
      </div>
    </div>
    <div class="feed-panel">
      <div class="feed-head">
        <span class="feed-head-label">Activity</span>
        <span class="feed-head-count" id="feedN">0</span>
      </div>
      <div class="status-bar">
        <div>
          <div class="egg-row">
            <span class="egg-row-label">Next egg drop</span>
            <span class="egg-row-timer" id="eggTimer">—</span>
          </div>
          <div class="egg-track"><div class="egg-track-fill" id="eggFill"></div></div>
        </div>
        <div class="mats-row">
          <div class="mat-chip">☕ <span class="n" id="matC">0</span></div>
          <div class="mat-chip">🌿 <span class="n" id="matO">0</span></div>
          <div class="mat-chip">⚡ <span class="n" id="matF">0</span></div>
        </div>
      </div>
      <div class="spirits-strip" id="spiritsStrip"></div>
      <div class="feed-scroll" id="feed"></div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
// CONFIG — Replace with your Supabase project
// ══════════════════════════════════════════════
const SUPABASE_URL = 'https://eyqddqtlgthgkiqjavyx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_CsTLSJj1YwgiHMxUTa685Q_2TVvZa2Q';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ══════════════════════════════════════════════
// YOUTUBE STREAMS
// ══════════════════════════════════════════════
const PL = {
  cafe:     { yt:'jfKfPfyJRdk', title:'lofi hip hop radio — beats to relax/study to', sub:'Café vibes' },
  outdoors: { yt:'M0F2tWjzYBk', title:'lofi hip hop radio — nature & chill',          sub:'Outdoors'   },
  focus:    { yt:'jfKfPfyJRdk', title:'lofi hip hop radio — beats to focus to',       sub:'Extreme Focus' }
};

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let S = {
  user: null,
  profile: null,
  spirits: [],
  emblems: { cafe_bean:0, wild_essence:0, focus_shard:0 },
  playing: false,
  pl: 'cafe',
  eggT: 0,
  EGG_SEC: 30,
  sessionId: null,
  feedN: 0,
  ticker: null,
  authMode: 'login' // 'login' or 'signup'
};

const SPIRIT_ICONS = { fox_lavender:'🦊', panda:'🐼', fox_fire:'🔥' };
const EVO_LABELS = ['I','II','III'];

// ══════════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════════
function toggleAuthMode(){
  S.authMode = S.authMode === 'login' ? 'signup' : 'login';
  const isSignup = S.authMode === 'signup';
  document.getElementById('authBtn').textContent = isSignup ? 'Create Account' : 'Sign In';
  document.getElementById('authToggle').textContent = isSignup ? 'Already have an account? Sign in' : 'Need an account? Sign up';
  document.getElementById('inUser').style.display = isSignup ? '' : 'none';
  document.getElementById('fieldUsername').style.display = isSignup ? '' : 'none';
  document.getElementById('authError').textContent = '';
}

async function doAuth(){
  const email = document.getElementById('inEmail').value.trim();
  const pass = document.getElementById('inPass').value;
  const btn = document.getElementById('authBtn');
  const errEl = document.getElementById('authError');
  errEl.textContent = '';

  if(!email || !pass){
    errEl.textContent = 'Email and password required';
    return;
  }
  if(pass.length < 6){
    errEl.textContent = 'Password must be at least 6 characters';
    return;
  }

  btn.disabled = true;

  try {
    let result;
    if(S.authMode === 'signup'){
      const username = document.getElementById('inUser').value.trim() || 'user_' + Math.random().toString(36).slice(2,8);
      result = await sb.auth.signUp({
        email, password: pass,
        options: { data: { username } }
      });
    } else {
      result = await sb.auth.signInWithPassword({ email, password: pass });
    }

    if(result.error) throw result.error;

    S.user = result.data.user;
    await loadUserData();
    enterApp();
  } catch(e){
    errEl.textContent = e.message || 'Auth failed';
  } finally {
    btn.disabled = false;
  }
}

async function doLogout(){
  if(S.sessionId){
    await sb.rpc('end_session', { p_session_id: S.sessionId });
    S.sessionId = null;
  }
  await sb.auth.signOut();
  S.user = null;
  S.playing = false;
  if(S.ticker){ clearInterval(S.ticker); S.ticker = null; }
  document.getElementById('shell').classList.remove('on');
  document.getElementById('login').classList.remove('gone');
  // Reset video
  const embed = document.getElementById('videoEmbed');
  const iframe = embed.querySelector('iframe');
  if(iframe) iframe.remove();
  embed.classList.remove('loaded');
  document.getElementById('videoPlaceholder').style.display = '';
}

// Check existing session on load
async function checkSession(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    S.user = session.user;
    await loadUserData();
    enterApp();
  }
}

// ══════════════════════════════════════════════
// LOAD USER DATA
// ══════════════════════════════════════════════
async function loadUserData(){
  if(!S.user) return;

  // Profile
  const { data: profile } = await sb.from('profiles').select('*').eq('id', S.user.id).single();
  S.profile = profile;

  // Spirits
  const { data: spirits } = await sb.from('spirits').select('*').eq('user_id', S.user.id);
  S.spirits = spirits || [];

  // Emblems
  const { data: emblems } = await sb.from('emblems').select('*').eq('user_id', S.user.id);
  if(emblems){
    emblems.forEach(e => { S.emblems[e.emblem_type] = e.quantity; });
  }
}

function enterApp(){
  document.getElementById('login').classList.add('gone');
  document.getElementById('shell').classList.add('on');
  document.getElementById('userName').textContent = S.profile?.username || 'user';
  updateUI();
  feed('👋','Welcome back, <b>' + (S.profile?.username || 'user') + '</b>');
  feed('🥚','Hit play to start collecting eggs');
}

// ══════════════════════════════════════════════
// UI UPDATES
// ══════════════════════════════════════════════
function updateUI(){
  // Egg count
  document.getElementById('eggCount').textContent = '🥚 ' + (S.profile?.total_eggs || 0);
  // Listen time
  const mins = Math.floor((S.profile?.total_listen_seconds || 0) / 60);
  document.getElementById('listenTime').textContent = '🎧 ' + mins + 'm';
  // Materials
  document.getElementById('matC').textContent = S.emblems.cafe_bean;
  document.getElementById('matO').textContent = S.emblems.wild_essence;
  document.getElementById('matF').textContent = S.emblems.focus_shard;
  // Spirits
  renderSpirits();
}

function renderSpirits(){
  const strip = document.getElementById('spiritsStrip');
  strip.innerHTML = '';
  const order = ['fox_lavender','panda','fox_fire'];
  order.forEach(type => {
    const sp = S.spirits.find(s => s.spirit_type === type);
    if(!sp) return;
    const el = document.createElement('div');
    el.className = 'spirit-mini';
    el.onclick = () => openModal(sp);
    el.innerHTML =
      '<div class="spirit-mini-icon">' + SPIRIT_ICONS[type] + '</div>' +
      '<div class="spirit-mini-name">' + sp.name + '</div>' +
      '<div class="spirit-mini-stage">' + EVO_LABELS[sp.evo_stage] + '</div>' +
      '<div class="evo-pips">' +
        [0,1,2].map(i => '<div class="evo-pip ' + (i <= sp.evo_stage ? 'on' : '') + '"></div>').join('') +
      '</div>';
    strip.appendChild(el);
  });
}

// ══════════════════════════════════════════════
// STREAM
// ══════════════════════════════════════════════
async function startStream(){
  if(S.playing) return;
  S.playing = true;
  const embed = document.getElementById('videoEmbed');
  const pl = PL[S.pl];
  const iframe = document.createElement('iframe');
  iframe.src = 'https://www.youtube.com/embed/' + pl.yt + '?autoplay=1&rel=0';
  iframe.allow = 'autoplay; encrypted-media';
  iframe.allowFullscreen = true;
  embed.insertBefore(iframe, embed.firstChild);
  embed.classList.add('loaded');
  document.getElementById('psPlay').textContent = '⏸';
  feed('🎵','Now streaming <b>' + pl.title + '</b>');

  // Start listen session in DB
  try {
    const { data } = await sb.rpc('start_session', { p_playlist: S.pl });
    S.sessionId = data;
  } catch(e){ console.warn('Session start failed:', e); }

  startTicker();
}

async function swapStream(){
  // End current session
  if(S.sessionId){
    try { await sb.rpc('end_session', { p_session_id: S.sessionId }); } catch(e){}
    S.sessionId = null;
  }

  const embed = document.getElementById('videoEmbed');
  const old = embed.querySelector('iframe');
  if(old) old.remove();
  const pl = PL[S.pl];
  if(S.playing){
    const iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube.com/embed/' + pl.yt + '?autoplay=1&rel=0';
    iframe.allow = 'autoplay; encrypted-media';
    iframe.allowFullscreen = true;
    embed.insertBefore(iframe, embed.firstChild);
    embed.classList.add('loaded');
    feed('🎵','Switched to <b>' + pl.title + '</b>');
    // New session
    try {
      const { data } = await sb.rpc('start_session', { p_playlist: S.pl });
      S.sessionId = data;
    } catch(e){}
  }
  document.getElementById('psTitle').textContent = pl.title;
  document.getElementById('psSub').textContent = pl.sub;
}

function setPl(el){
  document.querySelectorAll('.ps-pill').forEach(p => p.classList.remove('on'));
  el.classList.add('on');
  S.pl = el.dataset.pl;
  S.eggT = 0; // reset egg timer on playlist switch
  swapStream();
}

// ══════════════════════════════════════════════
// GAME TICK
// ══════════════════════════════════════════════
function startTicker(){
  if(S.ticker) return;
  S.ticker = setInterval(async () => {
    if(!S.playing) return;

    S.eggT += 0.5;
    const pct = Math.min((S.eggT / S.EGG_SEC) * 100, 100);
    document.getElementById('eggFill').style.width = pct + '%';
    const rem = Math.max(0, Math.ceil(S.EGG_SEC - S.eggT));
    document.getElementById('eggTimer').textContent = rem + 's';

    // Egg drop — server-validated
    if(S.eggT >= S.EGG_SEC){
      S.eggT = 0;
      try {
        const { data, error } = await sb.rpc('claim_egg_drop', { p_playlist: S.pl });
        if(error) throw error;
        if(data.error === 'too_fast'){
          feed('⏳','Rate limited — wait ' + data.wait_seconds + 's');
          return;
        }
        // Success
        S.profile.total_eggs = data.total_eggs;
        S.emblems[data.emblem_granted]++;
        document.getElementById('eggCount').textContent = '🥚 ' + data.total_eggs;
        updateUI();
        showToast(data.rarity);
        feed('🥚','<b>' + data.rarity + '</b> egg hatched! #' + data.total_eggs);

        const emblNames = { cafe_bean:'☕ Café Bean', wild_essence:'🌿 Wild Essence', focus_shard:'⚡ Focus Shard' };
        feed('✨','Found <b>' + emblNames[data.emblem_granted] + '</b>');
      } catch(e){
        console.error('Egg drop failed:', e);
        feed('❌','Egg drop failed — retrying...');
      }
    }
  }, 500);
}

// ══════════════════════════════════════════════
// CRAFTING / EVOLUTION
// ══════════════════════════════════════════════
function openModal(spirit){
  const cost = spirit.evo_stage === 0 ? 3 : 5;
  const canEvo = spirit.evo_stage < 2 &&
    S.emblems.cafe_bean >= cost &&
    S.emblems.wild_essence >= cost &&
    S.emblems.focus_shard >= cost;

  const box = document.getElementById('modalBox');
  box.innerHTML =
    '<div class="modal-icon">' + SPIRIT_ICONS[spirit.spirit_type] + '</div>' +
    '<div class="modal-title">' + spirit.name + '</div>' +
    '<div class="modal-stage">Stage ' + EVO_LABELS[spirit.evo_stage] + ' · ' + spirit.spirit_type.replace('_',' ') + '</div>' +
    (spirit.evo_stage < 2 ?
      '<div class="modal-cost">' +
        'Evolve to <b>Stage ' + EVO_LABELS[spirit.evo_stage + 1] + '</b> — costs ' + cost + '× each emblem<br>' +
        '☕ ' + S.emblems.cafe_bean + '/' + cost + ' · ' +
        '🌿 ' + S.emblems.wild_essence + '/' + cost + ' · ' +
        '⚡ ' + S.emblems.focus_shard + '/' + cost +
      '</div>' +
      '<button class="modal-btn" ' + (canEvo ? '' : 'disabled') + ' onclick="doEvolve(\'' + spirit.id + '\')">Evolve</button>' :
      '<div class="modal-cost">Max evolution reached ✨</div>'
    ) +
    '<button class="modal-btn secondary" onclick="closeModal()">Close</button>';

  document.getElementById('modal').classList.add('open');
}

function closeModal(){ document.getElementById('modal').classList.remove('open'); }

async function doEvolve(spiritId){
  try {
    const { data, error } = await sb.rpc('evolve_spirit', { p_spirit_id: spiritId });
    if(error) throw error;
    if(data.error){
      feed('❌','Evolution failed: ' + data.error);
      return;
    }

    // Refresh data
    await loadUserData();
    updateUI();
    closeModal();

    const sp = S.spirits.find(s => s.id === spiritId);
    feed('🌟','<b>' + (sp?.name || 'Spirit') + '</b> evolved to Stage ' + EVO_LABELS[data.new_stage] + '!');
    showToast('evolution');
  } catch(e){
    console.error('Evolve failed:', e);
    feed('❌','Evolution failed');
  }
}

// ══════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════
function showToast(rarity){
  const t = document.getElementById('toast');
  const isEvo = rarity === 'evolution';
  document.getElementById('toastI').textContent = isEvo ? '✨' : '🥚';
  document.getElementById('toastT').textContent = isEvo ? 'Evolution!' : rarity + ' Egg';
  document.getElementById('toastS').textContent = isEvo ? '' : '#' + S.profile.total_eggs;
  t.classList.add('show');
  if(!isEvo){
    setTimeout(() => {
      document.getElementById('toastI').textContent = '🐣';
      document.getElementById('toastT').textContent = 'Hatched!';
    }, 1000);
  }
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ══════════════════════════════════════════════
// FEED
// ══════════════════════════════════════════════
function feed(icon, text){
  const f = document.getElementById('feed');
  const now = new Date();
  const ts = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  const el = document.createElement('div');
  el.className = 'fi';
  el.innerHTML =
    '<div class="fi-icon">' + icon + '</div>' +
    '<div class="fi-body">' +
      '<div class="fi-text">' + text + '</div>' +
      '<div class="fi-time">' + ts + '</div>' +
    '</div>';
  f.insertBefore(el, f.firstChild);
  while(f.children.length > 50) f.removeChild(f.lastChild);
  S.feedN++;
  document.getElementById('feedN').textContent = S.feedN;
}

// ══════════════════════════════════════════════
// HANDLE PAGE CLOSE — end session
// ══════════════════════════════════════════════
window.addEventListener('beforeunload', () => {
  if(S.sessionId){
    // Use sendBeacon for reliable close
    const url = SUPABASE_URL + '/rest/v1/rpc/end_session';
    const body = JSON.stringify({ p_session_id: S.sessionId });
    navigator.sendBeacon(url, new Blob([body], { type: 'application/json' }));
  }
});

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
checkSession();
</script>
