<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>E Village</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,300&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ═══════════════════════════════════════
   E VILLAGE — Sprint 1 Rebuild
   Cozy monochrome, generous spacing
   ═══════════════════════════════════════ */

/* ── Theme variables ── */
[data-theme="dark"] {
  --bg: #080808; --surface: #0f0f0f; --elevated: #171717; --raised: #1e1e1e;
  --border: #1c1c1c; --border-l: #282828;
  --t1: #f0f0f0; --t2: #8a8a8a; --t3: #5a5a5a; --t4: #3a3a3a;
  --accent: #f0f0f0; --accent-dim: rgba(255,255,255,.04);
  --accent-soft: rgba(255,255,255,.08);
  --egg-glow: rgba(255,255,255,.06);
  --logo-color: #f0f0f0;
  --toast-bg: #171717;
}
[data-theme="light"] {
  --bg: #f5f3ef; --surface: #ebe8e2; --elevated: #e0ddd6; --raised: #d6d3cc;
  --border: #d0cdc6; --border-l: #c5c2bb;
  --t1: #1a1816; --t2: #6b6660; --t3: #9a958e; --t4: #b8b3ac;
  --accent: #1a1816; --accent-dim: rgba(0,0,0,.03);
  --accent-soft: rgba(0,0,0,.06);
  --egg-glow: rgba(0,0,0,.04);
  --logo-color: #1a1816;
  --toast-bg: #e0ddd6;
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--t1);
  -webkit-font-smoothing: antialiased;
  transition: background .4s, color .4s;
}

/* ═══ GUEST OVERLAY (watch without account) ═══ */
.guest-banner {
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 60;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 14px 20px;
  display: flex; align-items: center; justify-content: center; gap: 16px;
  transform: translateY(100%);
  transition: transform .4s cubic-bezier(.25,.46,.45,.94);
}
.guest-banner.show { transform: translateY(0); }
.guest-banner-text { font-size: .8rem; color: var(--t2); }
.guest-banner-text b { color: var(--t1); }
.guest-banner-btn {
  padding: 8px 20px; background: var(--t1); color: var(--bg);
  border: none; border-radius: 6px; font-family: inherit;
  font-size: .8rem; font-weight: 600; cursor: pointer;
  transition: opacity .15s;
}
.guest-banner-btn:hover { opacity: .85; }

/* ═══ LOGIN ═══ */
.login {
  position: fixed; inset: 0; z-index: 100;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  transition: opacity .5s, transform .5s;
}
.login.gone { opacity: 0; pointer-events: none; transform: scale(1.02); }
.login-inner { width: 100%; max-width: 360px; padding: 0 28px; }
.login-brand { text-align: center; margin-bottom: 48px; }
.login-brand h1 {
  font-family: 'Fraunces', serif;
  font-size: 2.4rem; font-weight: 300; font-style: italic;
  color: var(--logo-color);
  letter-spacing: -.02em; margin-bottom: 8px;
}
.login-brand p {
  font-size: .7rem; color: var(--t3);
  letter-spacing: .25em; text-transform: uppercase; font-weight: 300;
}
.login-field { margin-bottom: 16px; }
.login-field label {
  display: block; font-size: .65rem; color: var(--t3);
  text-transform: uppercase; letter-spacing: .12em;
  margin-bottom: 7px; font-weight: 500;
}
.login-field input {
  width: 100%; background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 16px; color: var(--t1);
  font-family: inherit; font-size: .85rem; outline: none;
  transition: border-color .2s;
}
.login-field input:focus { border-color: var(--t3); }
.login-field input::placeholder { color: var(--t4); }
.l-btn {
  width: 100%; padding: 13px; margin-top: 8px;
  background: var(--t1); color: var(--bg);
  border: none; border-radius: 8px; font-family: inherit;
  font-size: .85rem; font-weight: 600; cursor: pointer;
  transition: opacity .15s;
}
.l-btn:hover { opacity: .85; }
.l-btn:disabled { opacity: .35; cursor: wait; }
.l-div {
  display: flex; align-items: center; gap: 14px; margin: 22px 0;
  color: var(--t4); font-size: .6rem; text-transform: uppercase; letter-spacing: .15em;
}
.l-div::before, .l-div::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.l-secondary {
  width: 100%; padding: 12px; background: transparent;
  border: 1px solid var(--border); border-radius: 8px;
  color: var(--t2); font-family: inherit; font-size: .85rem;
  cursor: pointer; transition: all .15s;
}
.l-secondary:hover { border-color: var(--t3); color: var(--t1); }
.l-toggle {
  display: block; text-align: center; margin-top: 20px;
  background: none; border: none; color: var(--t3);
  font-family: inherit; font-size: .75rem; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px;
}
.l-toggle:hover { color: var(--t2); }
.l-error {
  color: #e55; font-size: .75rem; text-align: center;
  margin-top: 12px; min-height: 18px;
}
.l-error.ok { color: #5b5; }

/* ═══ APP SHELL ═══ */
.shell {
  height: 100vh; height: 100dvh;
  display: flex; flex-direction: column;
  opacity: 0; transition: opacity .4s .2s;
}
.shell.on { opacity: 1; }

/* ── Top bar ── */
.topbar {
  height: 44px; min-height: 44px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 0 20px; z-index: 10; flex-shrink: 0;
  transition: background .4s;
}
.tb-brand {
  font-family: 'Fraunces', serif;
  font-size: 1.05rem; font-weight: 300; font-style: italic;
  color: var(--logo-color);
  transition: color .4s;
}
.tb-right { display: flex; align-items: center; gap: 10px; }
.tb-stat {
  font-family: 'JetBrains Mono', monospace; font-size: .6rem; color: var(--t3);
  background: var(--accent-dim); padding: 4px 10px; border-radius: 12px;
}
.tb-theme {
  background: none; border: none; color: var(--t3);
  cursor: pointer; font-size: .85rem; padding: 4px;
  transition: color .15s; line-height: 1;
}
.tb-theme:hover { color: var(--t1); }
.tb-user { font-size: .75rem; color: var(--t2); }
.tb-logout {
  background: none; border: 1px solid var(--border); border-radius: 5px;
  color: var(--t3); font-family: inherit; font-size: .6rem;
  padding: 3px 8px; cursor: pointer; transition: all .15s;
}
.tb-logout:hover { border-color: var(--t3); color: var(--t2); }

/* ── Content ── */
.content { flex: 1; display: flex; overflow: hidden; min-height: 0; }

/* ═══ VIDEO ═══ */
.video-area { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
.video-embed { flex: 1; background: #000; position: relative; min-height: 0; }
.video-embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
.video-placeholder {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 16px;
  background: var(--bg); cursor: pointer; transition: background .3s;
}
.video-placeholder:hover { background: var(--surface); }
.vp-play {
  width: 64px; height: 64px; border-radius: 50%;
  border: 1.5px solid var(--t4);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem; color: var(--t3); transition: all .3s;
}
.video-placeholder:hover .vp-play { border-color: var(--t2); color: var(--t1); transform: scale(1.05); }
.vp-text { font-size: .7rem; color: var(--t4); letter-spacing: .15em; text-transform: uppercase; }
.video-embed.loaded .video-placeholder { display: none; }

/* Playlist swipe indicators (mobile) */
.pl-dots {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  display: none; gap: 6px; z-index: 5;
}
.pl-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255,255,255,.2); transition: all .2s;
}
.pl-dot.on { background: rgba(255,255,255,.7); width: 18px; border-radius: 3px; }

/* Player strip */
.player-strip {
  height: 50px; min-height: 50px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 20px; gap: 14px; flex-shrink: 0;
  transition: background .4s;
}
.ps-play {
  width: 32px; height: 32px;
  background: var(--t1); color: var(--bg);
  border: none; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .7rem; cursor: pointer; transition: opacity .15s;
  flex-shrink: 0;
}
.ps-play:hover { opacity: .8; }
.ps-info { flex: 1; min-width: 0; }
.ps-title { font-size: .8rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ps-sub { font-size: .65rem; color: var(--t3); margin-top: 1px; }
.ps-pills { display: flex; gap: 5px; }
.ps-pill {
  padding: 5px 14px; border-radius: 16px;
  border: 1px solid var(--border); background: transparent;
  color: var(--t3); font-family: inherit; font-size: .7rem;
  cursor: pointer; transition: all .15s;
}
.ps-pill:hover { border-color: var(--t3); color: var(--t2); }
.ps-pill.on { border-color: var(--t2); color: var(--t1); background: var(--accent-soft); }

/* ═══ SIDEBAR PANEL ═══ */
.sidebar {
  width: 320px; min-width: 320px;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: background .4s;
}

/* Egg timer (tiny) */
.egg-mini {
  padding: 12px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.egg-mini-label { font-size: .65rem; color: var(--t3); flex-shrink: 0; }
.egg-mini-bar { flex: 1; height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; }
.egg-mini-fill { height: 100%; background: var(--t1); border-radius: 2px; transition: width .5s linear; width: 0%; }
.egg-mini-time {
  font-family: 'JetBrains Mono', monospace; font-size: .6rem; color: var(--t4);
  min-width: 36px; text-align: right;
}

/* Tab navigation */
.tab-nav {
  display: flex; border-bottom: 1px solid var(--border);
  padding: 0 14px;
}
.tab-btn {
  flex: 1; padding: 10px 0; background: none; border: none;
  border-bottom: 2px solid transparent;
  color: var(--t3); font-family: inherit; font-size: .7rem;
  font-weight: 500; letter-spacing: .05em; text-transform: uppercase;
  cursor: pointer; transition: all .15s; text-align: center;
}
.tab-btn:hover { color: var(--t2); }
.tab-btn.on { color: var(--t1); border-bottom-color: var(--t1); }

/* Tab panels */
.tab-panels { flex: 1; overflow: hidden; position: relative; }
.tab-panel {
  position: absolute; inset: 0;
  overflow-y: auto; padding: 16px;
  opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
.tab-panel.on { opacity: 1; pointer-events: all; }
.tab-panel::-webkit-scrollbar { width: 3px; }
.tab-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── SPIRITS TAB ── */
.spirit-card {
  background: var(--elevated); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px;
  margin-bottom: 10px; cursor: pointer;
  transition: border-color .15s, background .15s;
  display: flex; align-items: center; gap: 14px;
}
.spirit-card:hover { border-color: var(--border-l); background: var(--raised); }
.spirit-card-icon { font-size: 1.6rem; flex-shrink: 0; }
.spirit-card-info { flex: 1; min-width: 0; }
.spirit-card-name { font-size: .85rem; font-weight: 600; margin-bottom: 2px; }
.spirit-card-meta { font-size: .65rem; color: var(--t3); margin-bottom: 6px; }
.spirit-card-bar-wrap {
  display: flex; align-items: center; gap: 8px;
}
.spirit-card-bar { flex: 1; height: 3px; background: var(--border); border-radius: 3px; overflow: hidden; }
.spirit-card-bar-fill { height: 100%; background: var(--t2); border-radius: 3px; transition: width .3s; }
.spirit-card-lvl {
  font-family: 'JetBrains Mono', monospace; font-size: .6rem; color: var(--t4);
}
.spirit-evo-pips { display: flex; gap: 3px; margin-left: auto; }
.spirit-evo-pip { width: 16px; height: 2px; border-radius: 2px; background: var(--border); }
.spirit-evo-pip.on { background: var(--t1); }

/* ── INGREDIENTS TAB ── */
.ing-section-label {
  font-size: .6rem; color: var(--t4); text-transform: uppercase;
  letter-spacing: .12em; margin-bottom: 10px; font-weight: 500;
}
.ing-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.ing-row {
  display: flex; align-items: center; gap: 12px;
  background: var(--elevated); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 14px;
}
.ing-icon { font-size: 1rem; flex-shrink: 0; }
.ing-name { font-size: .75rem; color: var(--t2); flex: 1; }
.ing-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: .85rem; font-weight: 500; color: var(--t1);
}
.ing-convert-btn {
  display: block; width: 100%; padding: 10px;
  background: var(--elevated); border: 1px solid var(--border);
  border-radius: 8px; color: var(--t3); font-family: inherit;
  font-size: .7rem; cursor: pointer; transition: all .15s;
  text-align: center;
}
.ing-convert-btn:hover { border-color: var(--border-l); color: var(--t2); }

/* ── VILLAGE TAB ── */
.village-rank-card {
  background: var(--elevated); border: 1px solid var(--border);
  border-radius: 10px; padding: 18px; text-align: center;
  margin-bottom: 16px;
}
.village-rank-label { font-size: .6rem; color: var(--t4); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 8px; }
.village-rank-name {
  font-family: 'Fraunces', serif; font-size: 1.4rem;
  font-weight: 500; margin-bottom: 4px;
}
.village-rank-desc { font-size: .7rem; color: var(--t3); }
.village-stat-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px;
}
.village-stat {
  background: var(--elevated); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px; text-align: center;
}
.village-stat-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1rem; font-weight: 500; margin-bottom: 2px;
}
.village-stat-label { font-size: .6rem; color: var(--t4); text-transform: uppercase; letter-spacing: .05em; }
.village-section-label {
  font-size: .6rem; color: var(--t4); text-transform: uppercase;
  letter-spacing: .12em; margin-bottom: 8px; margin-top: 12px; font-weight: 500;
}

/* ── ACTIVITY FEED (at bottom of sidebar) ── */
.feed-section {
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column;
  max-height: 40%; min-height: 120px;
}
.feed-head {
  padding: 10px 16px; display: flex; align-items: center;
  justify-content: space-between; flex-shrink: 0;
}
.feed-head-label { font-size: .6rem; color: var(--t4); text-transform: uppercase; letter-spacing: .1em; font-weight: 500; }
.feed-scroll { flex: 1; overflow-y: auto; padding: 4px 10px; }
.feed-scroll::-webkit-scrollbar { width: 2px; }
.feed-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.fi { display: flex; gap: 8px; padding: 7px 6px; border-radius: 6px; animation: fiIn .3s ease-out; }
@keyframes fiIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.fi-icon {
  width: 22px; height: 22px; border-radius: 5px;
  background: var(--accent-dim);
  display: flex; align-items: center; justify-content: center;
  font-size: .65rem; flex-shrink: 0;
}
.fi-body { flex: 1; min-width: 0; }
.fi-text { font-size: .7rem; color: var(--t2); line-height: 1.3; }
.fi-text b { color: var(--t1); font-weight: 600; }
.fi-time { font-family: 'JetBrains Mono', monospace; font-size: .5rem; color: var(--t4); margin-top: 1px; }
/* Tier importance */
.fi.major .fi-icon { background: var(--accent-soft); }
.fi.minor { opacity: .6; }

/* ═══ TOAST ═══ */
.toast {
  position: fixed; top: 56px; left: 16px; z-index: 50;
  background: var(--toast-bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 16px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 12px 40px rgba(0,0,0,.4);
  opacity: 0; transform: translateX(-20px);
  transition: all .4s cubic-bezier(.34,1.56,.64,1);
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(0); }
.toast-icon { font-size: 1.2rem; }
.toast-text { font-size: .8rem; font-weight: 500; }
.toast-sub { font-size: .6rem; color: var(--t3); }

/* ═══ MODAL ═══ */
.modal-bg {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(0,0,0,.6); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.modal-bg.open { opacity: 1; pointer-events: all; }
.modal-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; width: 90%; max-width: 380px;
  padding: 28px; text-align: center;
  transform: scale(.95); transition: transform .25s;
}
.modal-bg.open .modal-box { transform: scale(1); }
.modal-icon { font-size: 2.4rem; margin-bottom: 10px; }
.modal-title { font-family: 'Fraunces', serif; font-size: 1.4rem; font-weight: 500; margin-bottom: 4px; }
.modal-stage { font-family: 'JetBrains Mono', monospace; font-size: .7rem; color: var(--t3); margin-bottom: 18px; }
.modal-detail { font-size: .75rem; color: var(--t3); margin-bottom: 6px; line-height: 1.5; }
.modal-detail b { color: var(--t2); }
.modal-traits { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin: 12px 0; }
.modal-trait {
  padding: 4px 10px; border-radius: 12px; font-size: .65rem; font-weight: 500;
  background: var(--accent-dim); color: var(--t2); border: 1px solid var(--border);
}
.modal-trait.positive { color: #6b9; border-color: rgba(102,187,153,.2); }
.modal-trait.negative { color: #c77; border-color: rgba(204,119,119,.2); }
.modal-btn {
  padding: 11px 24px; border-radius: 8px; border: none;
  background: var(--t1); color: var(--bg);
  font-family: inherit; font-size: .8rem; font-weight: 600;
  cursor: pointer; transition: opacity .15s; margin: 4px;
}
.modal-btn:hover { opacity: .85; }
.modal-btn:disabled { opacity: .25; cursor: not-allowed; }
.modal-btn.secondary {
  background: transparent; border: 1px solid var(--border); color: var(--t2);
}

/* ═══ MOBILE ═══ */
@media (max-width: 768px) {
  .content { flex-direction: column; }
  .video-area { flex: none; height: 52vw; min-height: 200px; }
  .sidebar { width: 100%; min-width: 100%; flex: 1; border-left: none; border-top: 1px solid var(--border); }
  .player-strip { height: 46px; min-height: 46px; padding: 0 14px; gap: 10px; }
  .ps-pills { display: none; }
  .pl-dots { display: flex; }
  .topbar { height: 40px; min-height: 40px; padding: 0 14px; }
  .tb-brand { font-size: .95rem; }
  .feed-section { max-height: 35%; min-height: 100px; }
  .toast { top: 46px; left: 10px; }
}
@media (max-width: 420px) {
  .video-area { height: 50vw; min-height: 180px; }
}
</style>
</head>
<body>

<!-- GUEST BANNER -->
<div class="guest-banner" id="guestBanner">
  <span class="guest-banner-text">You hatched an egg! <b>Create an account</b> to keep it</span>
  <button class="guest-banner-btn" onclick="showLogin()">Sign Up</button>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <div class="toast-icon" id="toastI">🥚</div>
  <div>
    <div class="toast-text" id="toastT"></div>
    <div class="toast-sub" id="toastS"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modalBox"></div>
</div>

<!-- LOGIN -->
<div class="login gone" id="login">
  <div class="login-inner">
    <div class="login-brand">
      <h1>E Village</h1>
      <p>lo-fi · spirits · cultivate</p>
    </div>
    <div class="login-field" id="usernameField" style="display:none">
      <label>Username</label>
      <input type="text" id="inUser" placeholder="pick a username">
    </div>
    <div class="login-field">
      <label>Email</label>

<script>
// ═══ CONFIG ═══
const SUPABASE_URL = 'https://eyqddqtlgthgkiqjavyx.supabase.co';
const SUPABASE_ANON_KEY = 'https://abcdefgh.supabase.co';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ═══ PLAYLISTS ═══
const PL = {
  cafe:     { yt:'jfKfPfyJRdk', title:'lofi hip hop radio — beats to relax/study to', sub:'Café vibes' },
  outdoors: { yt:'M0F2tWjzYBk', title:'lofi hip hop radio — nature & chill',          sub:'Outdoors' },
  focus:    { yt:'jfKfPfyJRdk', title:'lofi hip hop radio — beats to focus to',       sub:'Extreme Focus' }
};
const PL_ORDER = ['cafe','outdoors','focus'];

// ═══ RARITY TIERS ═══
const RARITIES = [
  { name:'Mundane',      chance:.35,  color:'#888' },
  { name:'Adept',        chance:.25,  color:'#8ab' },
  { name:'Refined',      chance:.18,  color:'#7a7' },
  { name:'Illustrious',  chance:.10,  color:'#ba8' },
  { name:'Sovereign',    chance:.06,  color:'#a8c' },
  { name:'Celestial',    chance:.035, color:'#8cf' },
  { name:'Transcendent', chance:.01,  color:'#fc8' },
  { name:'Mysterious',   chance:.008, color:'#c8f' },
  { name:'Ancestral',    chance:.005, color:'#f88' },
  { name:'Paradox',      chance:.002, color:'#fff' },
];

const VILLAGE_RANKS = [
  { name:'Ember',     min:0,   desc:'Your village is a spark.' },
  { name:'Stone',     min:50,  desc:'Solid foundation.' },
  { name:'Bronze',    min:150, desc:'A real village is forming.' },
  { name:'Silver',    min:400, desc:'Respected and growing.' },
  { name:'Gold',      min:800, desc:'Prosperous and admired.' },
  { name:'Emerald',   min:1500,desc:'A beacon of cultivation.' },
  { name:'Celestial', min:3000,desc:'Your village radiates transcendence.' },
];

const SPIRIT_ICONS = { fox_lavender:'🦊', panda:'🐼', fox_fire:'🔥' };
const SPIRIT_NAMES_DEFAULT = { fox_lavender:'Mochi', panda:'Boba', fox_fire:'Kitsune' };
const EVO_LABELS = ['Seedling','Awakened','Ascended'];

// ═══ STATE ═══
let S = {
  user: null, profile: null, spirits: [],
  emblems: { cafe_bean:0, wild_essence:0, focus_shard:0 },
  playing: false, pl: 'cafe', plIndex: 0,
  eggT: 0, EGG_SEC: 3600, // 1 hour
  GUEST_EGG_SEC: 30, // 30 second hook for guests
  sessionId: null, feedN: 0, ticker: null,
  authMode: 'login', isGuest: true,
  guestEggGiven: false,
  theme: 'dark',
  touchStartX: 0,
};

// ═══ THEME ═══
function toggleTheme() {
  S.theme = S.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', S.theme);
  document.getElementById('themeBtn').textContent = S.theme === 'dark' ? '☀' : '🌙';
}

// ═══ TABS ═══
function switchTab(btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('on'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('tab-' + btn.dataset.tab).classList.add('on');
}

// ═══ AUTH ═══
function showLogin() {
  document.getElementById('login').classList.remove('gone');
  S.authMode = 'signup';
  document.getElementById('authBtn').textContent = 'Create Account';
  document.getElementById('authToggle').textContent = 'Already have an account? Sign in';
  document.getElementById('usernameField').style.display = '';
}
function toggleAuthMode() {
  S.authMode = S.authMode === 'login' ? 'signup' : 'login';
  const up = S.authMode === 'signup';
  document.getElementById('authBtn').textContent = up ? 'Create Account' : 'Sign In';
  document.getElementById('authToggle').textContent = up ? 'Already have an account? Sign in' : 'Need an account? Sign up';
  document.getElementById('usernameField').style.display = up ? '' : 'none';
  document.getElementById('authError').textContent = '';
}

async function doAuth() {
  const email = document.getElementById('inEmail').value.trim();
  const pass = document.getElementById('inPass').value;
  const btn = document.getElementById('authBtn');
  const errEl = document.getElementById('authError');
  errEl.textContent = ''; errEl.className = 'l-error';
  if (!email || !pass) { errEl.textContent = 'Email and password required'; return; }
  if (pass.length < 6) { errEl.textContent = 'Password must be 6+ characters'; return; }
  btn.disabled = true;
  try {
    let result;
    if (S.authMode === 'signup') {
      const username = document.getElementById('inUser').value.trim() || 'user_' + Math.random().toString(36).slice(2,8);
      result = await sb.auth.signUp({ email, password: pass, options: { data: { username } } });
      if (result.data?.user && !result.data.session) {
        errEl.className = 'l-error ok';
        errEl.textContent = 'Check your email to confirm!';
        btn.disabled = false; return;
      }
    } else {
      result = await sb.auth.signInWithPassword({ email, password: pass });
    }
    if (result.error) throw result.error;
    S.user = result.data.user;
    S.isGuest = false;
    await loadUserData();
    enterApp();
  } catch (e) { errEl.textContent = e.message || 'Auth failed'; }
  finally { btn.disabled = false; }
}

function enterGuest() {
  document.getElementById('login').classList.add('gone');
  S.isGuest = true; S.user = null;
  document.getElementById('userName').textContent = 'guest';
  document.getElementById('logoutBtn').style.display = 'none';
  loadGuestDefaults();
  feed('👋', 'Welcome! Hit play to start the lo-fi stream', 'major');
  feed('🥚', 'Your first egg drops in 30 seconds', 'minor');
}

function loadGuestDefaults() {
  S.spirits = [
    { id:'g1', spirit_type:'fox_lavender', name:'Mochi', evo_stage:0, xp:0 },
    { id:'g2', spirit_type:'panda', name:'Boba', evo_stage:0, xp:0 },
    { id:'g3', spirit_type:'fox_fire', name:'Kitsune', evo_stage:0, xp:0 },
  ];
  S.emblems = { cafe_bean:0, wild_essence:0, focus_shard:0 };
  S.profile = { total_eggs:0, total_listen_seconds:0, username:'guest' };
  updateAllUI();
}

async function doLogout() {
  if (S.sessionId) {
    try { await sb.rpc('end_session', { p_session_id: S.sessionId }); } catch(e) {}
    S.sessionId = null;
  }
  await sb.auth.signOut();
  S.user = null; S.playing = false; S.isGuest = true;
  if (S.ticker) { clearInterval(S.ticker); S.ticker = null; }
  const embed = document.getElementById('videoEmbed');
  const iframe = embed.querySelector('iframe');
  if (iframe) iframe.remove();
  embed.classList.remove('loaded');
  document.getElementById('logoutBtn').style.display = 'none';
  document.getElementById('userName').textContent = 'guest';
  loadGuestDefaults();
}

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    S.user = session.user;
    S.isGuest = false;
    await loadUserData();
    enterApp();
  }
}

async function loadUserData() {
  if (!S.user) return;
  const { data: profile } = await sb.from('profiles').select('*').eq('id', S.user.id).single();
  S.profile = profile;
  const { data: spirits } = await sb.from('spirits').select('*').eq('user_id', S.user.id);
  S.spirits = spirits || [];
  const { data: emblems } = await sb.from('emblems').select('*').eq('user_id', S.user.id);
  if (emblems) emblems.forEach(e => { S.emblems[e.emblem_type] = e.quantity; });
}

function enterApp() {
  document.getElementById('login').classList.add('gone');
  document.getElementById('guestBanner').classList.remove('show');
  document.getElementById('userName').textContent = S.profile?.username || 'user';
  document.getElementById('logoutBtn').style.display = '';
  updateAllUI();
  feed('👋', 'Welcome back, <b>' + (S.profile?.username || 'user') + '</b>', 'major');
}

// ═══ UI UPDATES ═══
function updateAllUI() {
  document.getElementById('eggCount').textContent = '🥚 ' + (S.profile?.total_eggs || 0);
  renderSpiritsTab();
  renderIngredientsTab();
  renderVillageTab();
}

function renderSpiritsTab() {
  const el = document.getElementById('tab-spirits');
  el.innerHTML = '';
  const order = ['fox_lavender','panda','fox_fire'];
  order.forEach(type => {
    const sp = S.spirits.find(s => s.spirit_type === type);
    if (!sp) return;
    const xpPct = Math.min(((sp.xp || 0) % 100), 100);
    const lvl = Math.floor((sp.xp || 0) / 100) + 1;
    const card = document.createElement('div');
    card.className = 'spirit-card';
    card.onclick = () => openSpiritModal(sp);
    card.innerHTML =
      '<div class="spirit-card-icon">' + SPIRIT_ICONS[type] + '</div>' +
      '<div class="spirit-card-info">' +
        '<div class="spirit-card-name">' + sp.name + '</div>' +
        '<div class="spirit-card-meta">' + EVO_LABELS[sp.evo_stage] + ' · Cultivation Lv.' + lvl + '</div>' +
        '<div class="spirit-card-bar-wrap">' +
          '<div class="spirit-card-bar"><div class="spirit-card-bar-fill" style="width:' + xpPct + '%"></div></div>' +
          '<span class="spirit-card-lvl">Lv.' + lvl + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="spirit-evo-pips">' +
        [0,1,2].map(i => '<div class="spirit-evo-pip ' + (i <= sp.evo_stage ? 'on' : '') + '"></div>').join('') +
      '</div>';
    el.appendChild(card);
  });
}

function renderIngredientsTab() {
  const el = document.getElementById('tab-ingredients');
  el.innerHTML =
    '<div class="ing-section-label">Primary Ingredients</div>' +
    '<div class="ing-grid">' +
      '<div class="ing-row"><span class="ing-icon">☕</span><span class="ing-name">Café Bean</span><span class="ing-count" id="icCafe">' + S.emblems.cafe_bean + '</span></div>' +
      '<div class="ing-row"><span class="ing-icon">🌿</span><span class="ing-name">Wild Essence</span><span class="ing-count" id="icOut">' + S.emblems.wild_essence + '</span></div>' +
      '<div class="ing-row"><span class="ing-icon">⚡</span><span class="ing-name">Focus Shard</span><span class="ing-count" id="icFocus">' + S.emblems.focus_shard + '</span></div>' +
    '</div>' +
    '<div class="ing-section-label">Convert (3:1 ratio)</div>' +
    '<button class="ing-convert-btn" onclick="openConvertModal()">Convert Ingredients →</button>' +
    '<div class="ing-section-label" style="margin-top:20px">Crafting</div>' +
    '<button class="ing-convert-btn" onclick="openCraftModal()">Craft Pills →</button>';
}

function renderVillageTab() {
  const el = document.getElementById('tab-village');
  const prestige = calcPrestige();
  const rank = VILLAGE_RANKS.slice().reverse().find(r => prestige >= r.min) || VILLAGE_RANKS[0];
  const nextRank = VILLAGE_RANKS[VILLAGE_RANKS.indexOf(rank) + 1];
  const totalListen = Math.floor((S.profile?.total_listen_seconds || 0) / 60);
  const spiritCount = S.spirits.length;
  el.innerHTML =
    '<div class="village-rank-card">' +
      '<div class="village-rank-label">Village Rank</div>' +
      '<div class="village-rank-name">' + rank.name + '</div>' +
      '<div class="village-rank-desc">' + rank.desc + '</div>' +
      (nextRank ? '<div style="font-size:.6rem;color:var(--t4);margin-top:8px">Next: ' + nextRank.name + ' (' + nextRank.min + ' prestige)</div>' : '') +
    '</div>' +
    '<div class="village-stat-grid">' +
      '<div class="village-stat"><div class="village-stat-num">' + prestige + '</div><div class="village-stat-label">Prestige</div></div>' +
      '<div class="village-stat"><div class="village-stat-num">' + (S.profile?.total_eggs || 0) + '</div><div class="village-stat-label">Eggs</div></div>' +
      '<div class="village-stat"><div class="village-stat-num">' + spiritCount + '</div><div class="village-stat-label">Spirits</div></div>' +
      '<div class="village-stat"><div class="village-stat-num">' + totalListen + 'm</div><div class="village-stat-label">Listened</div></div>' +
    '</div>' +
    '<div class="village-section-label">Spirit Index</div>' +
    '<div style="font-size:.7rem;color:var(--t3);padding:8px 0;">' + spiritCount + ' / 3 collected (starter set)</div>';
}

function calcPrestige() {
  let p = 0;
  S.spirits.forEach(sp => {
    p += (sp.evo_stage + 1) * 10;
    p += Math.floor((sp.xp || 0) / 100) * 5;
  });
  p += (S.profile?.total_eggs || 0) * 2;
  p += Math.floor((S.profile?.total_listen_seconds || 0) / 3600) * 3;
  return p;
}

// ═══ SPIRIT MODAL ═══
function openSpiritModal(sp) {
  const lvl = Math.floor((sp.xp || 0) / 100) + 1;
  const cost = sp.evo_stage === 0 ? 3 : 5;
  const canEvo = sp.evo_stage < 2 &&
    S.emblems.cafe_bean >= cost && S.emblems.wild_essence >= cost && S.emblems.focus_shard >= cost;
  const box = document.getElementById('modalBox');
  box.innerHTML =
    '<div class="modal-icon">' + SPIRIT_ICONS[sp.spirit_type] + '</div>' +
    '<div class="modal-title">' + sp.name + '</div>' +
    '<div class="modal-stage">' + EVO_LABELS[sp.evo_stage] + ' · Lv.' + lvl + ' · ' + sp.spirit_type.replace(/_/g,' ') + '</div>' +
    '<div class="modal-traits">' +
      '<span class="modal-trait positive">Curious</span>' +
      '<span class="modal-trait">Quiet</span>' +
      (sp.evo_stage > 0 ? '<span class="modal-trait positive">Resilient</span>' : '') +
    '</div>' +
    (sp.evo_stage < 2 ?
      '<div class="modal-detail">' +
        'Evolve to <b>' + EVO_LABELS[sp.evo_stage + 1] + '</b> — needs ' + cost + '× each ingredient<br>' +
        '☕ ' + S.emblems.cafe_bean + '/' + cost + ' · 🌿 ' + S.emblems.wild_essence + '/' + cost + ' · ⚡ ' + S.emblems.focus_shard + '/' + cost +
      '</div>' +
      '<button class="modal-btn" ' + (canEvo && !S.isGuest ? '' : 'disabled') + ' onclick="doEvolve(\'' + sp.id + '\')">Evolve</button>' :
      '<div class="modal-detail">Ascended ✨</div>'
    ) +
    '<button class="modal-btn secondary" onclick="closeModal()">Close</button>';
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
function openConvertModal() { feed('🔄', 'Ingredient conversion coming in Sprint 2', 'minor'); }
function openCraftModal() { feed('🧪', 'Pill crafting coming in Sprint 2', 'minor'); }

async function doEvolve(spiritId) {
  if (S.isGuest) return;
  try {
    const { data, error } = await sb.rpc('evolve_spirit', { p_spirit_id: spiritId });
    if (error) throw error;
    if (data.error) { feed('❌', 'Evolution failed: ' + data.error); return; }
    await loadUserData();
    updateAllUI();
    closeModal();
    const sp = S.spirits.find(s => s.id === spiritId);
    feed('🌟', '<b>' + (sp?.name || 'Spirit') + '</b> evolved to ' + EVO_LABELS[data.new_stage] + '!', 'major');
    showToast('evolution');
  } catch(e) { feed('❌', 'Evolution failed'); }
}

// ═══ STREAM ═══
async function startStream() {
  if (S.playing) return;
  S.playing = true;
  const embed = document.getElementById('videoEmbed');
  const pl = PL[S.pl];
  const iframe = document.createElement('iframe');
  iframe.src = 'https://www.youtube.com/embed/' + pl.yt + '?autoplay=1&rel=0';
  iframe.allow = 'autoplay; encrypted-media';
  iframe.allowFullscreen = true;
  embed.insertBefore(iframe, embed.firstChild);
  embed.classList.add('loaded');
  document.getElementById('psPlay').textContent = '⏸';
  feed('🎵', 'Now streaming <b>' + pl.title + '</b>');
  if (!S.isGuest) {
    try {
      const { data } = await sb.rpc('start_session', { p_playlist: S.pl });
      S.sessionId = data;
    } catch(e) {}
  }
  startTicker();
}

async function swapStream() {
  if (S.sessionId) {
    try { await sb.rpc('end_session', { p_session_id: S.sessionId }); } catch(e) {}
    S.sessionId = null;
  }
  const embed = document.getElementById('videoEmbed');
  const old = embed.querySelector('iframe');
  if (old) old.remove();
  if (S.playing) {
    const pl = PL[S.pl];
    const iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube.com/embed/' + pl.yt + '?autoplay=1&rel=0';
    iframe.allow = 'autoplay; encrypted-media';
    iframe.allowFullscreen = true;
    embed.insertBefore(iframe, embed.firstChild);
    embed.classList.add('loaded');
    feed('🎵', 'Switched to <b>' + PL[S.pl].title + '</b>');
    if (!S.isGuest) {
      try {
        const { data } = await sb.rpc('start_session', { p_playlist: S.pl });
        S.sessionId = data;
      } catch(e) {}
    }
  }
  document.getElementById('psTitle').textContent = PL[S.pl].title;
  document.getElementById('psSub').textContent = PL[S.pl].sub;
  updatePlDots();
}

function setPl(el) {
  document.querySelectorAll('.ps-pill').forEach(p => p.classList.remove('on'));
  el.classList.add('on');
  S.pl = el.dataset.pl;
  S.plIndex = PL_ORDER.indexOf(S.pl);
  S.eggT = 0;
  swapStream();
}

function setPlByIndex(idx) {
  idx = Math.max(0, Math.min(2, idx));
  S.plIndex = idx;
  S.pl = PL_ORDER[idx];
  document.querySelectorAll('.ps-pill').forEach(p => {
    p.classList.toggle('on', p.dataset.pl === S.pl);
  });
  S.eggT = 0;
  swapStream();
}

function updatePlDots() {
  document.querySelectorAll('.pl-dot').forEach((d, i) => {
    d.classList.toggle('on', PL_ORDER[i] === S.pl);
  });
}

// ═══ MOBILE SWIPE ═══
document.addEventListener('DOMContentLoaded', () => {
  const va = document.getElementById('videoArea');
  va.addEventListener('touchstart', e => { S.touchStartX = e.touches[0].clientX; }, { passive: true });
  va.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - S.touchStartX;
    if (Math.abs(dx) > 60) {
      if (dx < 0) setPlByIndex(S.plIndex + 1);
      else setPlByIndex(S.plIndex - 1);
    }
  }, { passive: true });
});

// ═══ GAME TICK ═══
function rollRarity() {
  const r = Math.random();
  let cum = 0;
  for (const tier of RARITIES) {
    cum += tier.chance;
    if (r < cum) return tier;
  }
  return RARITIES[0];
}

function startTicker() {
  if (S.ticker) return;
  const eggTime = () => S.isGuest && !S.guestEggGiven ? S.GUEST_EGG_SEC : S.EGG_SEC;

  S.ticker = setInterval(async () => {
    if (!S.playing) return;
    S.eggT += 0.5;
    const total = eggTime();
    const pct = Math.min((S.eggT / total) * 100, 100);
    document.getElementById('eggFill').style.width = pct + '%';
    const rem = Math.max(0, Math.ceil(total - S.eggT));
    const mins = Math.floor(rem / 60);
    const secs = rem % 60;
    document.getElementById('eggTimer').textContent = mins > 0 ? mins + 'm ' + secs + 's' : secs + 's';

    // Ingredient drops (every ~15 min on average)
    if (!S.isGuest && Math.random() < 0.00055) {
      const mat = S.pl === 'cafe' ? 'cafe_bean' : S.pl === 'outdoors' ? 'wild_essence' : 'focus_shard';
      S.emblems[mat]++;
      renderIngredientsTab();
      const names = { cafe_bean:'☕ Café Bean', wild_essence:'🌿 Wild Essence', focus_shard:'⚡ Focus Shard' };
      feed('✨', 'Found <b>' + names[mat] + '</b>', 'minor');
    }

    // Egg drop
    if (S.eggT >= total) {
      S.eggT = 0;
      if (S.isGuest) {
        // Guest first egg — hook
        if (!S.guestEggGiven) {
          S.guestEggGiven = true;
          const rarity = rollRarity();
          showToast(rarity.name);
          feed('🥚', '<b>' + rarity.name + '</b> egg hatched!', 'major');
          setTimeout(() => {
            document.getElementById('guestBanner').classList.add('show');
          }, 2000);
        }
      } else {
        // Logged-in user — server validated
        try {
          const { data, error } = await sb.rpc('claim_egg_drop', { p_playlist: S.pl });
          if (error) throw error;
          if (data.error === 'too_fast') return;
          S.profile.total_eggs = data.total_eggs;
          S.emblems[data.emblem_granted]++;
          document.getElementById('eggCount').textContent = '🥚 ' + data.total_eggs;
          updateAllUI();
          const rarity = rollRarity(); // Client-side display rarity (server determines actual)
          showToast(data.rarity || rarity.name);
          feed('🥚', '<b>' + (data.rarity || rarity.name) + '</b> egg hatched! #' + data.total_eggs, 'major');
        } catch(e) {
          feed('❌', 'Egg drop failed', 'minor');
        }
      }
    }
  }, 500);
}

// ═══ TOAST ═══
function showToast(rarity) {
  const t = document.getElementById('toast');
  const isEvo = rarity === 'evolution';
  document.getElementById('toastI').textContent = isEvo ? '✨' : '🥚';
  document.getElementById('toastT').textContent = isEvo ? 'Evolution!' : rarity + ' Egg';
  document.getElementById('toastS').textContent = isEvo ? '' : (S.isGuest ? 'Create account to keep!' : '#' + (S.profile?.total_eggs || 0));
  t.classList.add('show');
  if (!isEvo) setTimeout(() => {
    document.getElementById('toastI').textContent = '🐣';
    document.getElementById('toastT').textContent = 'Hatched!';
  }, 1000);
  setTimeout(() => t.classList.remove('show'), 3200);
}

// ═══ FEED ═══
function feed(icon, text, importance) {
  const f = document.getElementById('feed');
  const now = new Date();
  const ts = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  const el = document.createElement('div');
  el.className = 'fi' + (importance === 'major' ? ' major' : importance === 'minor' ? ' minor' : '');
  el.innerHTML =
    '<div class="fi-icon">' + icon + '</div>' +
    '<div class="fi-body"><div class="fi-text">' + text + '</div>' +
    '<div class="fi-time">' + ts + '</div></div>';
  f.insertBefore(el, f.firstChild);
  while (f.children.length > 40) f.removeChild(f.lastChild);
}

// ═══ PAGE CLOSE ═══
window.addEventListener('beforeunload', () => {
  if (S.sessionId && S.user) {
    navigator.sendBeacon(
      SUPABASE_URL + '/rest/v1/rpc/end_session',
      new Blob([JSON.stringify({ p_session_id: S.sessionId })], { type: 'application/json' })
    );
  }
});

// ═══ INIT ═══
checkSession().then(() => {
  if (!S.user) {
    // Guest mode — show app directly, no login wall
    loadGuestDefaults();
  }
});
</script>
